name: Evidencias TCC - Frontend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Registrar commit e ambiente
        shell: bash
        run: |
          estado_codigo="$(git status --porcelain)"
          if [ -n "$estado_codigo" ]; then
            printf '%s\n' "$estado_codigo"
            exit 1
          fi
          mkdir -p evidencias
          {
            echo "repositorio=$GITHUB_REPOSITORY"
            echo "commit_testado=$(git rev-parse HEAD)"
            echo "codigo_sem_alteracoes_locais=true"
            echo "referencia=$GITHUB_REF"
            echo "execucao=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "tentativa=$GITHUB_RUN_ATTEMPT"
            echo "inicio_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "fuso=UTC"
            uname -a
            cat /etc/os-release
            node --version
            npm --version
          } 2>&1 | tee evidencias/ambiente.log

      - name: Instalar dependencias
        shell: bash
        run: npm ci 2>&1 | tee evidencias/dependencias.log

      - name: Executar a suite do frontend
        shell: bash
        run: |
          echo 'comando=node --test tests/*.test.js' >> evidencias/ambiente.log
          set +e
          node --test tests/*.test.js 2>&1 | tee evidencias/testes.log
          codigo=${PIPESTATUS[0]}
          echo "fim_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> evidencias/ambiente.log
          echo "codigo_saida_testes=$codigo" >> evidencias/ambiente.log
          exit "$codigo"

      - name: Verificar o build
        shell: bash
        run: npm run build 2>&1 | tee evidencias/build.log

      - name: Salvar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-frontend-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: evidencias/
